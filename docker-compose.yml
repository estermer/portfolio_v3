services:
  db:
    image: postgres:16-alpine
    container_name: ericstermer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ericstermer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ericstermer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ericstermer} -d ${POSTGRES_DB:-ericstermer}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build: .
    container_name: ericstermer-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-ericstermer};Username=${POSTGRES_USER:-ericstermer};Password=${POSTGRES_PASSWORD}"
      Admin__Email: ${ADMIN_EMAIL:-admin@ericstermer.com}
      Admin__DisplayName: ${ADMIN_DISPLAY_NAME:-Eric Stermer}
      Admin__Password: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      Site__BaseUrl: ${SITE_BASE_URL:-https://ericstermer.com}
    volumes:
      - app_data:/app/data
      - app_keys:/app/.aspnet

volumes:
  postgres_data:
  app_data:
  app_keys: